<text x="0" y="272" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#8a8781">NHL API draft picks + bios. Pick 73 became Zach Olsen (TOR) after Detroit sent it to St. Louis for Faulk.</text>
