<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Twelve and a half goals separated what happened from what was supposed to happen." font-family="'Space Grotesk', ui-sans-serif, system-ui, sans-serif" style="max-width:100%;height:auto;background:#d7d6d3">
