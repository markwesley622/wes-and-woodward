<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" role="img" aria-label="What happened to the other 45 forwards" font-family="'Space Grotesk', ui-sans-serif, system-ui, sans-serif" style="max-width:100%;height:auto;background:#e9e8e5">
<rect width="760" height="266" fill="#e9e8e5"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#141414">What happened to the other 45 forwards</text>
<text x="0" y="38" font-size="12" fill="#575653">Streaks of 400+ minutes that are over (Rasmussen and Jack Studnicka excluded). A streak can count in more than one row</text>
<rect x="250" y="66" width="172.0" height="22" fill="#b3b1ad"/>
<rect x="250" y="66" width="47.8" height="22" fill="#c98500"/>
<text x="242.0" y="81.0" font-size="12" fill="#141414" text-anchor="end">Kept an NHL job the next season</text>
<text x="428.0" y="81.0" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#575653" text-anchor="start">18 of 45 (5 of the 6 at 13+ min)</text>
<rect x="250" y="100" width="152.9" height="22" fill="#b3b1ad"/>
<rect x="250" y="100" width="9.6" height="22" fill="#c98500"/>
<text x="242.0" y="115.0" font-size="12" fill="#141414" text-anchor="end">AHL games in a streak season</text>
<text x="408.9" y="115.0" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#575653" text-anchor="start">16 of 45 (1 of the 6 at 13+ min)</text>
<rect x="250" y="134" width="105.1" height="22" fill="#b3b1ad"/>
<text x="242.0" y="149.0" font-size="12" fill="#141414" text-anchor="end">Changed teams mid-streak</text>
<text x="361.1" y="149.0" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#575653" text-anchor="start">11 of 45 (0 of the 6 at 13+ min)</text>
<rect x="250" y="168" width="114.7" height="22" fill="#b3b1ad"/>
<text x="242.0" y="183.0" font-size="12" fill="#141414" text-anchor="end">NHL career over by season's end</text>
<text x="370.7" y="183.0" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#575653" text-anchor="start">12 of 45 (0 of the 6 at 13+ min)</text>
<line x1="250.0" y1="60" x2="250.0" y2="196" stroke="#c4c3bf" stroke-width="1"/>
<text x="250.0" y="210.0" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#575653" text-anchor="middle">0</text>
<line x1="393.3" y1="60" x2="393.3" y2="196" stroke="#c4c3bf" stroke-width="1"/>
<text x="393.3" y="210.0" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#575653" text-anchor="middle">15</text>
<line x1="536.7" y1="60" x2="536.7" y2="196" stroke="#c4c3bf" stroke-width="1"/>
<text x="536.7" y="210.0" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#575653" text-anchor="middle">30</text>
<line x1="680.0" y1="60" x2="680.0" y2="196" stroke="#c4c3bf" stroke-width="1"/>
<text x="680.0" y="210.0" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#575653" text-anchor="middle">45</text>
<rect x="250" y="42" width="11" height="11" rx="2" fill="#b3b1ad"/>
<text x="266" y="52" font-size="12" fill="#141414">All forwards</text>
<rect x="372" y="42" width="11" height="11" rx="2" fill="#c98500"/>
<text x="388" y="52" font-size="12" fill="#141414">Of which 13+ min a night</text>
<text x="0" y="258" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#8a8781">Source: NHL API game logs + player season totals (AHL games by season, not by date, so the AHL row is an upper bound).</text>
</svg>